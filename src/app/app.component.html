<mat-toolbar class="sophisticated-header" *ngIf="isAuthenticated$ | async">
  <span class="toolbar-title">
    <img src="assets/images/whg-logo.png" 
         alt="WhiteHat Gaming Logo" 
         class="header-logo">
    Laptop tracking system
  </span>
  
  <span class="toolbar-spacer"></span>
  
  <button mat-icon-button 
          (click)="logout()" 
          matTooltip="Logout"
          class="logout-button">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<router-outlet></router-outlet>
